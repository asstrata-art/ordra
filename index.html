<!DOCTYPE html>
<html lang="nb" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordra – ordrebok / order book</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ordra">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Ordra gratis. Palett: hvitt papir, sort blekk, oransje aksent bare på handling. Layout: fanerad nederst på mobil, topplinje med faner på desktop; ordrebok i to paneler på bred skjerm. */
:root{
  --bg:#f7f7f5; --paper:#ffffff; --ink:#0f1115; --ink-2:#2a2a2a; --muted:#5c5c5a; --faint:#8a8a86; --line:#e2e2e2; --line-2:#eeeeee;
  --accent:#ff6a00; --accent-ink:#ffffff; --pill:#eeeeeb; --pill-ink:#2a2a2a; --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#b4530a; --warn-bg:#fff1e8;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:18px; --nav:66px; --shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --paper:#191919; --ink:#f2f2f2; --ink-2:#d6d6d6; --muted:#a3a3a3; --faint:#6e6e6e; --line:#2e2e2e; --line-2:#242424;
  --accent:#ff6a33; --accent-ink:#111111; --pill:#262626; --pill-ink:#d6d6d6; --ok:#5fcf93; --ok-bg:#173326; --warn:#f0a062; --warn-bg:#3a2418;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --paper:#191919; --ink:#f2f2f2; --ink-2:#d6d6d6; --muted:#a3a3a3; --faint:#6e6e6e; --line:#2e2e2e; --line-2:#242424;
  --accent:#ff6a33; --accent-ink:#111111; --pill:#262626; --pill-ink:#d6d6d6; --ok:#5fcf93; --ok-bg:#173326; --warn:#f0a062; --warn-bg:#3a2418;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.12;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.hdr{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:14px}
.hdr .brand{font-weight:700;letter-spacing:.14em;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.hdr .brand{flex-wrap:nowrap;flex:none}.hdr .brand .ver{display:inline-block;margin:0 0 0 6px;text-align:left}
.hdr .brand i{width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(12deg)}
.hdr .tabsnav{display:none}
.hdr .sp{margin-left:auto;font-size:12px;color:#9a9a9a;display:flex;align-items:center;gap:8px}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.syncdot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}.syncdot.ok{background:#5fcf93}.syncdot.synker{background:#f0a062;animation:pulse 1s infinite}.syncdot.feil{background:#e5484d}@keyframes pulse{50%{opacity:.3}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#111;display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:0;padding:8px 2px 6px;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:#8a8a8a;min-height:var(--nav);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:#fff}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .tabbar{display:none}
  .hdr{padding:12px 32px;gap:28px}
  .hdr .tabsnav{display:flex;gap:4px}
  .hdr .tabsnav button{background:none;border:0;border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px;color:#9a9a9a}
  .hdr .tabsnav button.on{background:#fff;color:#111}
}
.page{max-width:1120px;margin:0 auto;padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.page{padding:28px 32px 48px}}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph .t{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ph h1{font-size:28px;margin-top:4px}
.ph p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}
.kpi{border:0;background:none;text-align:left;padding:16px 0 0;border-top:1.5px solid var(--line);color:var(--ink)}
.kpi .v{font-size:40px;font-weight:400;line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:14px;color:var(--muted);margin-top:8px}
.kpi.warn{border-top:3px solid var(--accent)}
@media (max-width:420px){.kpi .v{font-size:32px}.kpis{gap:12px}}
.box{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.box>h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.box>h2 .more{margin-left:auto;font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;background:none;border:0;color:var(--ink);text-decoration:underline}
.empty{color:var(--faint);padding:8px 0}
.rows{display:flex;flex-direction:column}
.rows button{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line-2);padding:12px 2px;text-align:left;font-weight:600;color:var(--ink);min-height:46px;font-size:14.5px}
.rows button:last-child{border-bottom:0}
.pill{margin-left:auto;background:var(--pill);color:var(--pill-ink);font-weight:600;font-size:13px;padding:3px 11px;border-radius:999px;min-width:32px;text-align:center}
.pill.hot{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;color:var(--ink)}
button.card:hover{border-color:var(--ink)}
.card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.card .s{color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.card .r{text-align:right;flex:none;font-size:12.5px;color:var(--muted)}
.card .r .num{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--pill);color:var(--pill-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--ink);color:var(--bg)}
.split{display:block}
.split .pane-detail{display:none}
.split.has .pane-list{display:none}
.split.has .pane-detail{display:block}
.chooser{display:none}
@media (min-width:1000px){
  .split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
  .split .pane-list,.split.has .pane-list{display:block;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding-right:2px}
  .split .pane-detail{display:block}
  .chooser{display:flex;flex-direction:column;justify-content:center;min-height:420px;border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow);padding:48px 44px}
  .chooser h2{font-size:38px;margin-top:20px;max-width:14ch}
  .chooser p{color:var(--muted);font-size:17px;margin:18px 0 0;max-width:36ch}
  .pane-list .card .r{display:none}
}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fold{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.fold h1{font-size:24px;overflow-wrap:anywhere;margin-top:2px}
.fold .s{color:var(--muted);font-size:14px}
.money{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.money .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.money .v{font-weight:600;font-size:18px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;min-height:42px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.tools select{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;min-height:42px}
.tools input{flex:1 1 170px}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;min-height:42px;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.sec{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.card:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:430px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15.5px;color:var(--ink);width:100%;min-height:44px;font-weight:500}
.f textarea{min-height:84px;resize:vertical}
.help{font-size:13px;color:var(--muted)}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px;font-weight:600}
.lines td{padding:4px;vertical-align:middle}
.lines input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:38px;min-width:0;font-size:14.5px}
.lines td.n input{text-align:right;font-variant-numeric:tabular-nums}
.lines td.x{width:34px}.lines td.x button{background:none;border:0;color:var(--muted);font-size:20px;padding:4px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14.5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sum .num{text-align:right}.sum .tot{font-weight:700;font-size:16.5px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos .ph{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);position:relative;padding:0}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .add{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;border:1px dashed var(--faint);background:var(--bg);cursor:pointer;font-size:13px;font-weight:600;text-align:center;padding:6px}
.photos .add input{display:none}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{padding:8px 0;border-bottom:1px solid var(--line-2);display:flex;gap:12px}
.log li:last-child{border-bottom:0}.log li .num{color:var(--faint);flex:none;min-width:88px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;max-width:92vw;text-align:center;pointer-events:none}
.toast.on{opacity:1}
@media (min-width:900px){.toast{bottom:24px}}
.sheet{border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--ink);padding:20px;margin-top:14px}
.sheet h1{font-size:22px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:85vh;border-radius:8px}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:#fff;color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.lb .del{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:none;color:#fff;border:1px solid #666;border-radius:999px;padding:8px 16px}
.pdfwrap{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:70vh}
.pdfwrap iframe{width:100%;height:100%;border:0;background:#fff}
pre.copy{white-space:pre-wrap;font:13.5px/1.55 var(--font);background:var(--bg);border-radius:10px;padding:12px;margin:8px 0 0;border:1px solid var(--line)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.menu{display:grid;gap:10px}
@media (min-width:640px){.menu{grid-template-columns:1fr 1fr}}

.befrow{display:grid;grid-template-columns:1fr 110px 32px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line-2)}
.befrow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;font-size:14.5px;min-width:0}
.befrow .befl{border-color:transparent;background:transparent;padding-left:2px}
.befrow .befl:focus{background:var(--bg);border-color:var(--line)}
.befrow .befv{font-weight:600;text-align:right}
.befrow button{background:none;border:0;color:var(--muted);font-size:18px}
.calweek{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media(min-width:1000px){.calweek{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.calday{min-height:220px}}
.calday{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.calday h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px;font-size:13px;text-transform:capitalize;font-weight:600}
.calday h3 .num{color:var(--muted);font-weight:500}
.calday.today{outline:2px solid var(--accent);outline-offset:-2px}
.calday.past{opacity:.6}
.calday.wknd{background:transparent;box-shadow:none;border:1px dashed var(--line)}
.calev{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.calev.bef{border-left-color:var(--accent)}.calev.oppf{border-left-color:var(--warn)}
.calev .tm{font-size:11px;color:var(--muted)}.calev .tt{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}.calev .lc{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.calfree{font-size:12px;color:var(--muted);padding:4px 0}

:root{--st-ny:#8a8f98;--st-bef:#c47f17;--st-tua:#7a5af5;--st-sendt:#1f6fd1;--st-skal:#0f8a6a;--st-ferdig:#2e9e5b;--st-oppf:#d1452c;--st-avs:#5e6066;--st-tapt:#b7b9bf}
.card{border-left:4px solid var(--stripe,var(--line))}
.chip .sdot{width:7px;height:7px;border-radius:50%;background:var(--stripe,var(--faint));flex:none}
.chip.st{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.hdr .co{font-weight:500;font-size:13px;color:#d6d6d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.hdr .logo{height:22px;width:auto;border-radius:4px;background:#fff;padding:1px}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hero .t{flex:1;min-width:0}
.hero .date{font-size:13px;color:var(--muted);text-transform:capitalize}
.hero h1{font-size:30px;margin-top:2px}
.kpis{gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:12px;padding:14px 14px 12px}
.kpi.warn{border-top-color:var(--accent)}
.kpi.hot{border-top-color:var(--st-sendt)}
.kpi .v{font-size:34px}
.onb{max-width:560px;margin:8px auto 0}
.onb .mark{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center;margin-bottom:16px}
.onb .mark i{width:16px;height:16px;background:var(--accent);border-radius:3px;transform:rotate(12deg)}
.onb h1{font-size:30px}
.onb p{color:var(--muted);margin:10px 0 18px}
.onb .steps{display:flex;gap:8px;margin-bottom:16px}
.onb .steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.onb .steps i.on{background:var(--ink)}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.langs button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.langs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.logo-up{display:flex;gap:12px;align-items:center}
.logo-up img{height:44px;width:auto;max-width:160px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.logo-up label{cursor:pointer}
.logo-up input{display:none}
.empty-big{text-align:center;padding:36px 20px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.empty-big h2{font-size:22px}
.empty-big p{color:var(--muted);margin:8px auto 16px;max-width:38ch}
.ver{font-size:12px;color:var(--faint);text-align:center;margin-top:24px}
.menu .card{border-left:1px solid var(--line)}

/* Kontrast i skjemafelt */
:root{--field:#ffffff;--field-br:#b9b9b4;--ph:#767672}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--field:#222222;--field-br:#4a4a4a;--ph:#9a9a9a}}
:root[data-theme="dark"]{--field:#222222;--field-br:#4a4a4a;--ph:#9a9a9a}
.f{font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:0}
.f input,.f select,.f textarea,.tools input,.tools select,.lines input,.befrow input{background:var(--field);border:1.5px solid var(--field-br);color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.f input:focus,.f select:focus,.f textarea:focus,.tools input:focus,.lines input:focus,.befrow input:focus{border-color:var(--ink);outline:2px solid var(--accent);outline-offset:1px}
::placeholder{color:var(--ph);-webkit-text-fill-color:var(--ph);opacity:1}
.befrow .befl{border-color:transparent;background:transparent}
.befrow .befl:focus{background:var(--field);border-color:var(--ink)}
.befrow .befv{background:var(--field)}
.card{border-color:#cfcfca}
:root{--field:#ffffff}
.box,.fold,.kpi,.calday,.empty-big{border:1px solid #e3e3e0}

/* ===== Datalag. Byttes til Supabase i Pro: samme API (list/get/put/del). ===== */
const Store=(()=>{
  const K='ordra.v1';let db={ordre:{},kunder:{},kal:{},timer:{},tips:{},innst:null,logg:[]};
  try{const s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Kunne ikke lagre – fullt lager?')}};
  return{
    list:c=>Object.values(db[c]||{}),get:(c,id)=>(db[c]||{})[id],
    put(c,o,quiet){if(!db[c])db[c]={};if(!o._id)o._id=newId(c.slice(0,2));o.oppdatert=nowIso();db[c][o._id]=o;save();if(!quiet&&window.Sync)Sync.onPut(c,o);return o},
    del(c,id,quiet){delete db[c][id];save();if(!quiet&&window.Sync)Sync.onDel(c,id)},
    innst:()=>db.innst,setInnst(v,quiet){db.innst=v;save();if(!quiet&&window.Sync)Sync.onInnst(v)},
    all:()=>db,
    merge(c,rows){if(!db[c])db[c]={};let n=0;rows.forEach(r=>{const cur=db[c][r.id];if(r.slettet){if(cur){delete db[c][r.id];n++}return}const d=r.data||{};if(!cur||!(cur.oppdatert&&d.oppdatert&&cur.oppdatert>d.oppdatert)){d._id=r.id;db[c][r.id]=d;n++}});if(n)save();return n},
    log(txt,ref){db.logg.unshift({t:nowIso(),txt,ref});db.logg=db.logg.slice(0,300);save()},logg:()=>db.logg,
    export:()=>JSON.stringify(db,null,1),import(j){const d=JSON.parse(j);if(!d.ordre)throw 0;db=Object.assign({ordre:{},kunder:{},kal:{},timer:{},tips:{},innst:null,logg:[]},d);save();if(window.Sync&&Sync.on())Sync.pushAll()},
    wipe(){db={ordre:{},kunder:{},kal:{},timer:{},tips:{},innst:null,logg:[]};save()}
  };
})();
/* Bilder i IndexedDB (data-URL, nedskalert) */
const Photos=(()=>{
  let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('ordra-bilder',1);r.onupgradeneeded=()=>r.result.createObjectStore('b',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction('b',m),s=t.objectStore('b'),q=f(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
  return{
    async put(ordre,file){const data=await shrink(file);const id=newId('b');await tx('readwrite',s=>s.put({id,ordre,data,t:nowIso()}));return id},
    async list(ordre){const all=await tx('readonly',s=>s.getAll());return (all||[]).filter(x=>x.ordre===ordre)},
    async del(id){await tx('readwrite',s=>s.delete(id))}
  };
  function shrink(file){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1600,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};img.src=u})}
})();

Object.assign(T_EN,{"Kundetype": "Customer type", "Privat": "Private", "Bedrift/borettslag": "Business/housing association", "Avtalen inngås": "Agreement made", "På befaring hos kunden": "At the customer's premises", "På kontoret / i butikk": "At our office / shop", "Digitalt (e-post, telefon, nett)": "Remotely (email, phone, web)", "Pristype": "Price type", "Fastpris": "Fixed price", "Prisoverslag (maks +15 %)": "Estimate (max +15 %)", "Regningsarbeid (timer og materiell)": "Time and materials", "Privatkunde: prisen vises inkl. mva på tilbudet. Fakturagebyr er ikke tillatt.": "Private customer: prices shown incl. VAT on the quote. Invoice fees are not allowed.", "Bedriftskunde: priser eks. mva.": "Business customer: prices excl. VAT.", "Angrerett": "Right of withdrawal", "Avtalen inngås hos kunden, derfor legges angrerettinformasjon og angreskjema automatisk ved tilbudet. Kunden har 14 dagers angrerett fra avtaledagen.": "The agreement is made at the customer premises, so withdrawal information and a withdrawal form are attached to the quote automatically. The customer has 14 days from the agreement date.", "Kunden har uttrykkelig bedt om oppstart før angrefristen går ut, og er informert om at angreretten tapes når arbeidet er fullført.": "The customer has expressly requested work to start before the withdrawal period ends and has been informed that the right of withdrawal lapses when the work is completed.", "Avtaledato": "Agreement date", "angrefrist": "withdrawal deadline", "Prisoverslag inkl. mva": "Estimate incl. VAT", "Anslag inkl. mva": "Indicative incl. VAT", "Maks ved sluttoppgjør (+15 %)": "Maximum at final settlement (+15 %)", "FAKTURAGRUNNLAG – ikke salgsdokument. Fakturanummer og forfall settes i regnskapssystemet.": "INVOICE BASIS – not a sales document. Invoice number and due date are set in the accounting system.", "Prisoverslaget kan etter håndverkertjenesteloven ikke overskrides vesentlig, og aldri med mer enn 15 %": "Under the Norwegian Craftsman Services Act the estimate may not be exceeded significantly, and never by more than 15 %", "Regningsarbeid: faktureres etter medgåtte timer og materiell, spesifisert på fakturaen.": "Time and materials: invoiced for hours and materials used, itemised on the invoice.", "Opplysninger om angrerett": "Information on the right of withdrawal", "Denne avtalen inngås utenfor fast forretningslokale (på befaring hos deg). Du har derfor rett til å gå fra avtalen innen 14 dager uten å oppgi grunn, jf. angrerettloven.": "This agreement is made away from business premises (at your home). You therefore have the right to withdraw within 14 days without giving any reason.", "Angrefristen løper fra den dagen avtalen ble inngått.": "The withdrawal period runs from the day the agreement was made.", "For å bruke angreretten må du gi oss beskjed på en utvetydig måte (brev, e-post eller SMS) til kontaktopplysningene nedenfor. Du kan bruke skjemaet under, men det er ikke påkrevd.": "To exercise the right of withdrawal, inform us unambiguously (letter, email or text) using the contact details below. You may use the form below, but it is not required.", "Du har uttrykkelig bedt om at arbeidet starter før angrefristen er ute. Går du fra avtalen etter at arbeidet er påbegynt, må du betale for den delen som er utført. Angreretten faller bort når tjenesten er fullført.": "You have expressly requested that work starts before the withdrawal period ends. If you withdraw after work has begun, you must pay for the part performed. The right of withdrawal lapses when the service is completed.", "Arbeidet starter ikke før angrefristen er ute, med mindre du uttrykkelig ber om det. Ber du om oppstart før fristen, må du betale for utført arbeid dersom du angrer, og angreretten faller bort når tjenesten er fullført.": "Work will not start before the withdrawal period ends unless you expressly request it. If you request an early start, you must pay for work performed if you withdraw, and the right lapses when the service is completed.", "Hastereparasjoner som du selv uttrykkelig har bedt om, er unntatt fra angreretten.": "Urgent repairs you have expressly requested are exempt from the right of withdrawal.", "Angreskjema": "Withdrawal form", "Fyll ut og send dette skjemaet bare dersom du ønsker å gå fra avtalen.": "Complete and return this form only if you wish to withdraw from the agreement.", "Jeg/vi meddeler herved at jeg/vi ønsker å gå fra min/vår avtale om kjøp av følgende tjeneste:": "I/we hereby give notice that I/we withdraw from my/our contract for the following service:", "Avtalen ble inngått den": "Agreement made on", "Forbrukerens navn": "Consumer name", "Forbrukerens adresse": "Consumer address", "Dato og underskrift": "Date and signature", "Anmodning om oppstart før angrefristen": "Request to start before the withdrawal period ends", "Jeg ber uttrykkelig om at arbeidet påbegynnes før angrefristen på 14 dager er utløpt. Jeg er kjent med at jeg må betale for utført arbeid dersom jeg benytter angreretten, og at angreretten faller bort når tjenesten er fullført.": "I expressly request that work begins before the 14-day withdrawal period has expired. I understand that I must pay for work performed if I withdraw, and that the right of withdrawal lapses when the service is completed.", "Denne ordren har dokumenter som skal oppbevares i 5 år. Sett den til Avsluttet i stedet – trykk igjen for å slette likevel": "This order has documents that must be kept for 5 years. Set it to Closed instead – tap again to delete anyway"});Object.assign(T_ALL.sv,{"Kundetype": "Kundtyp", "Privat": "Privat", "Bedrift/borettslag": "Företag/förening", "Avtalen inngås": "Avtalet ingås", "På befaring hos kunden": "Vid platsbesök hos kunden", "På kontoret / i butikk": "På kontoret / i butik", "Digitalt (e-post, telefon, nett)": "Digitalt (e-post, telefon, webb)", "Pristype": "Pristyp", "Fastpris": "Fast pris", "Prisoverslag (maks +15 %)": "Prisuppskattning (max +15 %)", "Regningsarbeid ( Object.assign(T_EN,{"F.eks. råte i svill bak kledning":"E.g. rot in the sill plate behind the cladding","F.eks. Lillehammer":"E.g. Lillehammer","I henhold til plan- og bygningsloven § 21-3 varsles naboer og gjenboere om tiltaket. Eventuelle merknader må være kommet til ansvarlig søker/tiltakshaver innen 14 dager etter at varselet er sendt. Vedlagt følger tegninger og situasjonskart som viser tiltaket.":"Pursuant to the Norwegian Planning and Building Act § 21-3, neighbours and opposite neighbours are hereby notified of the project. Any comments must reach the responsible applicant/owner within 14 days of this notice being sent. Drawings and a site plan showing the project are attached.","Merknader sendes til":"Comments are sent to","Kvittering for nabovarsel":"Receipt for neighbour notice","Nabo/gjenboer (navn, adresse, gnr/bnr)":"Neighbour (name, address, property no.)","Varsel mottatt (dato, signatur)":"Notice received (date, signature)","Samtykker i tiltaket":"Consents to the project","Gjenta for hver nabo. Legg kvitteringene ved søknaden.":"Repeat for each neighbour. Attach the receipts to the application.","Vurdering av søknadsplikt":"Assessment of permit requirement","Opplysninger fra befaringen":"Information from the site visit","Grunnlaget er utarbeidet av":"Prepared by","Søknaden sendes av tiltakshaver eller ansvarlig søker via kommunens byggesaksløsning.":"The application is submitted by the owner or responsible applicant through the municipality's building-permit portal.",

"Vindu/dør/fasadeendring":"Window/door/facade change","Bytte av vindu og dør i samme størrelse og utseende er normalt unntatt søknadsplikt. Endret størrelse, nye åpninger eller endret fasadeuttrykk kan være søknadspliktig fasadeendring (pbl § 20-1 bokstav c) – sjekk med kommunen, særlig ved bevaringsverdig bebyggelse.":"Replacing windows and doors with the same size and appearance is normally exempt from a permit. Changed size, new openings or an altered facade may be a permit-requiring facade change (Planning and Building Act § 20-1 c) – check with the municipality, especially for listed buildings.","Søknad om tiltak uten ansvarsrett (pbl § 20-4) ved søknadspliktig fasadeendring på bolig":"Application without responsible contractor (PBA § 20-4) for a permit-requiring facade change on a dwelling","Fasadetegninger før og etter":"Facade drawings before and after","Situasjonskart":"Site plan","Nabovarsel med kvittering (hvis søknadspliktig)":"Neighbour notice with receipt (if a permit is required)",
"Terrasse/platting":"Deck/patio","Terrasse inntil 1,0 m over terreng, inntil 15 m² og minst 1 m fra nabogrense er unntatt søknadsplikt (SAK10 § 4-1). Større eller høyere terrasser kan søkes om uten ansvarsrett (pbl § 20-4) når den er tilknyttet bolig.":"A deck up to 1.0 m above ground, up to 15 m² and at least 1 m from the boundary is exempt from a permit (SAK10 § 4-1). Larger or higher decks attached to a dwelling can be applied for without a responsible contractor (PBA § 20-4).","Søknad om tiltak uten ansvarsrett (pbl § 20-4)":"Application without responsible contractor (PBA § 20-4)","Situasjonskart med mål og avstand til nabogrense":"Site plan with dimensions and distance to boundary","Tegning med høyde over terreng og rekkverk":"Drawing with height above ground and railing","Nabovarsel med kvittering":"Neighbour notice with receipt","Eventuelt dispensasjonssøknad (avstand/utnyttelse)":"Exemption application if needed (distance/site coverage)",
"Tilbygg":"Extension","Tilbygg inntil 15 m² BRA/BYA uten rom for varig opphold (bod, veranda, åpent overbygg) er unntatt søknadsplikt (SAK10 § 4-1) når det ligger minst 4 m fra nabogrense. Tilbygg inntil 50 m² kan søkes om uten ansvarsrett (SAK10 § 3-1); større tilbygg krever ansvarlig foretak.":"An extension up to 15 m² without habitable rooms (storage, veranda, open roof) is exempt from a permit (SAK10 § 4-1) when at least 4 m from the boundary. Extensions up to 50 m² can be applied for without a responsible contractor (SAK10 § 3-1); larger ones require a responsible contractor.","Søknad om tiltak uten ansvarsrett (pbl § 20-4) – inntil 50 m²; ellers søknad med ansvarsrett (pbl § 20-3)":"Application without responsible contractor (PBA § 20-4) – up to 50 m²; otherwise with responsible contractor (PBA § 20-3)","Plan-, snitt- og fasadetegninger":"Plan, section and facade drawings","Beregning av utnyttelsesgrad (BYA)":"Site coverage calculation (BYA)","Eventuell dispensasjon":"Exemption if needed",
"Garasje/bod/uthus":"Garage/shed/outbuilding","Frittliggende bygning inntil 50 m² BRA/BYA, mønehøyde inntil 4 m og gesims inntil 3 m, minst 1 m fra nabogrense og uten rom for varig opphold, er unntatt søknadsplikt (SAK10 § 4-1). Kommunen skal likevel ha melding om plassering når bygget er ferdig. Større bygg: søknad uten ansvarsrett inntil 70 m², ellers med ansvarsrett.":"A detached building up to 50 m², ridge height up to 4 m and eaves up to 3 m, at least 1 m from the boundary and without habitable rooms, is exempt from a permit (SAK10 § 4-1). The municipality must still be notified of its placement when finished. Larger buildings: application without responsible contractor up to 70 m², otherwise with one.","Melding til kommunen om ferdig tiltak unntatt søknadsplikt – eller søknad uten ansvarsrett (pbl § 20-4)":"Notification to the municipality of a completed exempt project – or application without responsible contractor (PBA § 20-4)","Situasjonskart med plassering":"Site plan with placement","Tegninger med høyder":"Drawings with heights","Melding om plassering til kommunen etter ferdigstilling (unntatt tiltak)":"Placement notification to the municipality after completion (exempt project)","Nabovarsel (søknadspliktig)":"Neighbour notice (if a permit is required)",
"Innvendig arbeid":"Interior work","Innvendige arbeider i egen boenhet (kjøkken, bad, gulv, vegger som ikke er bærende) er normalt unntatt søknadsplikt. Inngrep i bærende konstruksjon, brannskiller eller etablering av ny boenhet er søknadspliktig og krever ansvarlig foretak (pbl § 20-3).":"Interior work within a dwelling (kitchen, bathroom, floors, non-load-bearing walls) is normally exempt from a permit. Work on load-bearing structure, fire separations or creating a new dwelling unit requires a permit and a responsible contractor (PBA § 20-3).","Normalt ingen søknad":"Normally no application","Ved bad: dokumentasjon fra våtromsnorm/fagperson":"Bathrooms: wet-room standard documentation from a professional","Ved bærende inngrep: statiske beregninger og ansvarsrett":"Load-bearing work: structural calculations and responsible contractor",
"Riving":"Demolition","Riving av bygning som kunne vært oppført uten søknad er unntatt; riving av større bygg er søknadspliktig og krever avfallsplan ved over 100 m² eller 10 tonn avfall (TEK17 kap. 9).":"Demolishing a building that could have been built without a permit is exempt; demolishing larger buildings requires a permit and a waste plan above 100 m² or 10 tonnes of waste (TEK17 ch. 9).","Søknad om riving (pbl § 20-3/§ 20-4)":"Demolition application (PBA § 20-3/§ 20-4)","Avfallsplan og miljøkartlegging (>100 m²)":"Waste plan and environmental survey (>100 m²)",
"Graving/vei/VA":"Excavation/road/water & sewer","Graving i offentlig grunn krever gravetillatelse og arbeidsvarslingsplan fra kommunen/vegeier. Tilknytning til kommunalt vann og avløp krever søknad til VA-etaten med ansvarlig rørlegger.":"Excavation on public land requires an excavation permit and a traffic-control plan from the municipality/road owner. Connecting to municipal water and sewer requires an application to the water authority with a responsible plumber.","Gravetillatelse og VA-søknad via kommunens portal":"Excavation permit and water/sewer application via the municipal portal","Gravemelding/kabelpåvisning (Geomatikk/ledningsportalen)":"Dig notice/cable locating (Geomatikk/utility portal)","Arbeidsvarslingsplan":"Traffic-control plan","VA-søknad med sanitærabonnement":"Water/sewer application with sanitary subscription"});

"F.eks. råte i svill bak kledning":"Z. B. Fäulnis in der Schwelle hinter der Verkleidung","F.eks. Lillehammer":"Z. B. Lillehammer","I henhold til plan- og bygningsloven § 21-3 varsles naboer og gjenboere om tiltaket. Eventuelle merknader må være kommet til ansvarlig søker/tiltakshaver innen 14 dager etter at varselet er sendt. Vedlagt følger tegninger og situasjonskart som viser tiltaket.":"Gemäß dem norwegischen Plan- und Baugesetz § 21-3 werden Nachbarn und Gegenüberwohnende über das Vorhaben benachrichtigt. Etwaige Einwände müssen innerhalb von 14 Tagen nach Versand dieser Benachrichtigung beim verantwortlichen Antragsteller/Bauherrn eingegangen sein. Zeichnungen und Lageplan des Vorhabens liegen bei.","Merknader sendes til":"Einwände sind zu richten an","Kvittering for nabovarsel":"Empfangsbestätigung Nachbarbenachrichtigung","Nabo/gjenboer (navn, adresse, gnr/bnr)":"Nachbar (Name, Adresse, Flurstück)","Varsel mottatt (dato, signatur)":"Benachrichtigung erhalten (Datum, Unterschrift)","Samtykker i tiltaket":"Stimmt dem Vorhaben zu","Gjenta for hver nabo. Legg kvitteringene ved søknaden.":"Für jeden Nachbarn wiederholen. Die Bestätigungen dem Antrag beilegen.","Vurdering av søknadsplikt":"Einschätzung der Genehmigungspflicht","Opplysninger fra befaringen":"Angaben aus der Besichtigung","Grunnlaget er utarbeidet av":"Unterlage erstellt von","Søknaden sendes av tiltakshaver eller ansvarlig søker via kommunens byggesaksløsning.":"Der Antrag wird vom Bauherrn oder verantwortlichen Antragsteller über das Bauantragsportal der Gemeinde eingereicht.",

"Vindu/dør/fasadeendring":"Fenster/Tür/Fassadenänderung","Bytte av vindu og dør i samme størrelse og utseende er normalt unntatt søknadsplikt. Endret størrelse, nye åpninger eller endret fasadeuttrykk kan være søknadspliktig fasadeendring (pbl § 20-1 bokstav c) – sjekk med kommunen, særlig ved bevaringsverdig bebyggelse.":"Der Austausch von Fenstern und Türen in gleicher Größe und Optik ist in der Regel genehmigungsfrei. Geänderte Größe, neue Öffnungen oder ein verändertes Fassadenbild können eine genehmigungspflichtige Fassadenänderung sein (pbl § 20-1 Buchst. c) – bei der Gemeinde nachfragen, besonders bei erhaltenswerter Bebauung.","Søknad om tiltak uten ansvarsrett (pbl § 20-4) ved søknadspliktig fasadeendring på bolig":"Antrag ohne verantwortliches Unternehmen (pbl § 20-4) bei genehmigungspflichtiger Fassadenänderung am Wohnhaus","Fasadetegninger før og etter":"Fassadenzeichnungen vorher und nachher","Situasjonskart":"Lageplan","Nabovarsel med kvittering (hvis søknadspliktig)":"Nachbarbenachrichtigung mit Bestätigung (falls genehmigungspflichtig)",
"Terrasse/platting":"Terrasse/Podest","Terrasse inntil 1,0 m over terreng, inntil 15 m² og minst 1 m fra nabogrense er unntatt søknadsplikt (SAK10 § 4-1). Større eller høyere terrasser kan søkes om uten ansvarsrett (pbl § 20-4) når den er tilknyttet bolig.":"Eine Terrasse bis 1,0 m über Gelände, bis 15 m² und mindestens 1 m von der Grundstücksgrenze ist genehmigungsfrei (SAK10 § 4-1). Größere oder höhere Terrassen am Wohnhaus können ohne verantwortliches Unternehmen beantragt werden (pbl § 20-4).","Søknad om tiltak uten ansvarsrett (pbl § 20-4)":"Antrag ohne verantwortliches Unternehmen (pbl § 20-4)","Situasjonskart med mål og avstand til nabogrense":"Lageplan mit Maßen und Abstand zur Grundstücksgrenze","Tegning med høyde over terreng og rekkverk":"Zeichnung mit Höhe über Gelände und Geländer","Nabovarsel med kvittering":"Nachbarbenachrichtigung mit Bestätigung","Eventuelt dispensasjonssøknad (avstand/utnyttelse)":"Ggf. Befreiungsantrag (Abstand/Bebauungsgrad)",
"Tilbygg":"Anbau","Tilbygg inntil 15 m² BRA/BYA uten rom for varig opphold (bod, veranda, åpent overbygg) er unntatt søknadsplikt (SAK10 § 4-1) når det ligger minst 4 m fra nabogrense. Tilbygg inntil 50 m² kan søkes om uten ansvarsrett (SAK10 § 3-1); større tilbygg krever ansvarlig foretak.":"Ein Anbau bis 15 m² ohne Aufenthaltsräume (Abstellraum, Veranda, offene Überdachung) ist genehmigungsfrei (SAK10 § 4-1), wenn er mindestens 4 m von der Grundstücksgrenze entfernt liegt. Anbauten bis 50 m² können ohne verantwortliches Unternehmen beantragt werden (SAK10 § 3-1); größere erfordern ein verantwortliches Unternehmen.","Søknad om tiltak uten ansvarsrett (pbl § 20-4) – inntil 50 m²; ellers søknad med ansvarsrett (pbl § 20-3)":"Antrag ohne verantwortliches Unternehmen (pbl § 20-4) – bis 50 m²; sonst Antrag mit verantwortlichem Unternehmen (pbl § 20-3)","Plan-, snitt- og fasadetegninger":"Grundriss-, Schnitt- und Fassadenzeichnungen","Beregning av utnyttelsesgrad (BYA)":"Berechnung des Bebauungsgrads (BYA)","Eventuell dispensasjon":"Ggf. Befreiung",
"Garasje/bod/uthus":"Garage/Schuppen/Nebengebäude","Frittliggende bygning inntil 50 m² BRA/BYA, mønehøyde inntil 4 m og gesims inntil 3 m, minst 1 m fra nabogrense og uten rom for varig opphold, er unntatt søknadsplikt (SAK10 § 4-1). Kommunen skal likevel ha melding om plassering når bygget er ferdig. Større bygg: søknad uten ansvarsrett inntil 70 m², ellers med ansvarsrett.":"Ein freistehendes Gebäude bis 50 m², Firsthöhe bis 4 m und Traufhöhe bis 3 m, mindestens 1 m von der Grundstücksgrenze und ohne Aufenthaltsräume, ist genehmigungsfrei (SAK10 § 4-1). Die Gemeinde muss dennoch nach Fertigstellung über die Lage informiert werden. Größere Gebäude: Antrag ohne verantwortliches Unternehmen bis 70 m², sonst mit.","Melding til kommunen om ferdig tiltak unntatt søknadsplikt – eller søknad uten ansvarsrett (pbl § 20-4)":"Meldung an die Gemeinde über das fertige genehmigungsfreie Vorhaben – oder Antrag ohne verantwortliches Unternehmen (pbl § 20-4)","Situasjonskart med plassering":"Lageplan mit Standort","Tegninger med høyder":"Zeichnungen mit Höhen","Melding om plassering til kommunen etter ferdigstilling (unntatt tiltak)":"Lagemeldung an die Gemeinde nach Fertigstellung (genehmigungsfreies Vorhaben)","Nabovarsel (søknadspliktig)":"Nachbarbenachrichtigung (genehmigungspflichtig)",
"Innvendig arbeid":"Innenarbeiten","Innvendige arbeider i egen boenhet (kjøkken, bad, gulv, vegger som ikke er bærende) er normalt unntatt søknadsplikt. Inngrep i bærende konstruksjon, brannskiller eller etablering av ny boenhet er søknadspliktig og krever ansvarlig foretak (pbl § 20-3).":"Innenarbeiten in der eigenen Wohneinheit (Küche, Bad, Böden, nichttragende Wände) sind in der Regel genehmigungsfrei. Eingriffe in tragende Konstruktion, Brandabschnitte oder die Schaffung einer neuen Wohneinheit sind genehmigungspflichtig und erfordern ein verantwortliches Unternehmen (pbl § 20-3).","Normalt ingen søknad":"In der Regel kein Antrag","Ved bad: dokumentasjon fra våtromsnorm/fagperson":"Bei Bad: Dokumentation nach Nassraumnorm/Fachkraft","Ved bærende inngrep: statiske beregninger og ansvarsrett":"Bei tragenden Eingriffen: statische Berechnungen und verantwortliches Unternehmen",
"Riving":"Abriss","Riving av bygning som kunne vært oppført uten søknad er unntatt; riving av større bygg er søknadspliktig og krever avfallsplan ved over 100 m² eller 10 tonn avfall (TEK17 kap. 9).":"Der Abriss eines Gebäudes, das genehmigungsfrei hätte errichtet werden können, ist genehmigungsfrei; der Abriss größerer Gebäude ist genehmigungspflichtig und erfordert ab 100 m² oder 10 t Abfall einen Abfallplan (TEK17 Kap. 9).","Søknad om riving (pbl § 20-3/§ 20-4)":"Abrissantrag (pbl § 20-3/§ 20-4)","Avfallsplan og miljøkartlegging (>100 m²)":"Abfallplan und Schadstoffkartierung (>100 m²)",
"Graving/vei/VA":"Erdarbeiten/Straße/Wasser & Abwasser","Graving i offentlig grunn krever gravetillatelse og arbeidsvarslingsplan fra kommunen/vegeier. Tilknytning til kommunalt vann og avløp krever søknad til VA-etaten med ansvarlig rørlegger.":"Erdarbeiten auf öffentlichem Grund erfordern eine Aufgrabungsgenehmigung und einen Verkehrssicherungsplan der Gemeinde/des Straßeneigentümers. Der Anschluss an kommunales Wasser und Abwasser erfordert einen Antrag beim Wasserwerk mit verantwortlichem Installateur.","Gravetillatelse og VA-søknad via kommunens portal":"Aufgrabungsgenehmigung und Wasser-/Abwasserantrag über das Gemeindeportal","Gravemelding/kabelpåvisning (Geomatikk/ledningsportalen)":"Grabungsanzeige/Leitungsauskunft (Geomatikk/Leitungsportal)","Arbeidsvarslingsplan":"Verkehrssicherungsplan","VA-søknad med sanitærabonnement":"Wasser-/Abwasserantrag mit Anschlussvertrag"});

  /* Trenger deg */
  {const g=Store.list('godkjenning').filter(x=>x.status==='Venter');const op=Store.list('oppgaver').filter(x=>x.status!=='Ferdig'&&x.frist&&daysTo(x.frist)<=1);
   if(g.length||op.length)h+=`<div class="box"><h2>${t('Venter på deg')} <span class="pill hot">${g.length+op.length}</span><button class="more" data-panelmer="${g.length?'godk':'huske'}">${t('Alle')}</button></h2><div class="list">${g.slice(0,4).map(x=>`<button class="card" data-panelmer="godk" style="--stripe:var(--accent)"><div class="main"><div class="t">${esc(x.tittel||x.type||'')}</div><div class="s">${esc(x.agent||'')} · ${t('til godkjenning')}</div></div></button>`).join('')}${op.slice(0,4).map(x=>`<button class="card" data-panelmer="huske" style="--stripe:var(--st-skal)"><div class="main"><div class="t">${esc(x.tekst||'')}</div><div class="s">${x.frist?dmy(x.frist):''}${daysTo(x.frist)<0?' · '+t('forfalt'):''}</div></div></button>`).join('')}</div></div>`}
  const need=[...k.oppf.map(o=>({o,why:t('Følg opp tilbudet'),cls:'warn'})),...k.aktive.filter(o=>gaps(o).length&&!k.oppf.includes(o)).slice(0,3).map(o=>({o,why:t('Mangler')+' '+gaps(o).map(x=>t(x)).join(', '),cls:''})),...all.filter(o=>o.status==='Ferdig utført'&&!o.fakturagrunnlagDato).map(o=>({o,why:t('Lag fakturagrunnlag'),cls:'ok'}))];
  if(need.length)h+=`<div class="box"><h2>${t('Venter på deg')} <span class="pill hot">${need.length}</span></h2><div class="list">${need.slice(0,6).map(({o,why,cls})=>`<button class="card" data-open="${esc(o._id)}" style="--stripe:${stv(o.status)}"><div class="main"><div class="t">${esc(lbl(o))} ${esc(o.tittel||'(uten tittel)')}</div><div class="s">${esc(o.kunde||'')}</div><div class="chips"><span class="chip ${cls}">${esc(why)}</span></div></div></button>`).join('')}</div></div>`;
  /* Neste 7 dager */
  if(wk.length)h+=`<div class="box"><h2>Neste 7 dager</h2><ul class="log">${wk.slice(0,8).map(x=>`<li><span class="num">${esc(new Date(x.d+'T00:00:00').toLocaleDateString(LOCALE[LANG]||'nb-NO',{weekday:'short',day:'numeric'}))}</span><span style="flex:1">${x.ord?`<button class="lnk" data-open="${esc(x.ord)}">${esc(x.txt)}</button>`:esc(x.txt)}${x.sub?` <span class="help">· ${esc(x.sub)}</span>`:''}</span></li>`).join('')}</ul></div>`;
  /* Status som chips */
  h+=`<div class="box"><h2>Status</h2><div class="chips">${STATUSER.filter(AKTIVE).map(s=>{const n=k.aktive.filter(o=>o.status===s).length;return n?`<button class="chip stc" data-nav="ordre" data-st="${esc(s)}" style="--stripe:${stv(s)}"><span class="sdot"></span>${esc(s)} <b>${n}</b></button>`:''}).join('')||`<span class="help">${t('Ingen aktive ordre.')}</span>`}</div></div>`;
  h+=`<p class="help" style="text-align:center;margin:6px 0 14px"><button class="btn sec sm" data-panelmer="tips">${t('Savner du noe?')}</button></p>`;
  {const al=Store.list('agentlogg').sort((a,b)=>(b.t||'').localeCompare(a.t||'')).slice(0,5);if(al.length)h+=`<div class="box"><h2>${t('Siste fra agentene')}<button class="more" data-panelmer="agenter">${t('Agentkontorene')}</button></h2><ul class="log">${al.map(x=>`<li><span class="num">${esc((x.t||'').slice(5,16).replace('T',' '))}</span><span><b>${esc(x.agent||'')}</b> ${esc(x.txt||'')}</span></li>`).join('')}</ul></div>`}
  const lg=Store.logg().slice(0,6);if(lg.length)h+=`<div class="box"><h2>Sist</h2><ul class="log">${lg.map(x=>`<li><span class="num">${esc(dmy(x.t.slice(0,10)))} ${esc(x.t.slice(11,16))}</span><span>${esc(x.txt)}</span></li>`).join('')}</ul></div>`;
  return h}

function lbl(o){if(!o.nr&&o.skId)return 'ARK';return '#'+String(o.nr||0).padStart(3,'0')}
const NEXT={'Ny dialog':'Befaring','Befaring':'Tilbud under arbeid','Tilbud under arbeid':'Sendt tilbud','Sendt tilbud':'Skal utføres','Skal utføres':'Ferdig utført','Ferdig utført':'Avsluttet'};const nextStatus=s=>NEXT[s]||null;
ICON.phone='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';ICON.msg='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M4 5h16v11H8l-4 4z"/></svg>';ICON.pin='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';ICON.arrow='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const STCOL={'Ny dialog':'--st-ny','Befaring':'--st-bef','Tilbud under arbeid':'--st-tua','Sendt tilbud':'--st-sendt','Skal utføres':'--st-skal','Ferdig utført':'--st-ferdig','Oppfølging':'--st-oppf','Avsluttet':'--st-avs','Tapt':'--st-tapt'};
const stv=s=>`var(${STCOL[s]||'--st-ny'})`;
function ordCard(o){const g=gaps(o);const s=sumTilbud(o);const d=o.befaring&&daysTo(o.befaring);
  return `<button class="card ${S.ord===o._id?'on':''}" data-open="${esc(o._id)}" style="--stripe:${stv(o.status)}"><div class="main"><div class="t">${esc(lbl(o))} ${esc(o.tittel||'(uten tittel)')}</div><div class="s">${esc(o.kunde||'Ingen kunde')}${o.adresse?' · '+esc(o.adresse):''}</div><div class="chips"><span class="chip st"><span class="sdot"></span>${esc(o.status)}</span>${o.befaring&&d>=0&&d<=7?`<span class="chip warn">Befaring ${d===0?'i dag':d===1?'i morgen':dmy(o.befaring)}</span>`:''}${o.oppf&&daysTo(o.oppf)<=0?`<span class="chip warn">Følg opp</span>`:''}${g.length?`<span class="chip">Mangler ${esc(g.join(', '))}</span>`:''}</div></div><div class="r">${s.eks?`<span class="num">${nok(s.eks)}</span>eks. mva`:''}</div></button>`}

function vOrdrebok(){const all=orders();let list=all;
  if(S.st==='oppf')list=list.filter(o=>o.oppf&&daysTo(o.oppf)<=0);else if(S.st==='alle')list=list;else if(S.st)list=list.filter(o=>o.status===S.st);else list=list.filter(o=>AKTIVE(o.status));
  if(S.q){const q=S.q.toLowerCase();list=list.filter(o=>[o.tittel,o.kunde,o.adresse,o.telefon,o.beskrivelse,lbl(o)].join(' ').toLowerCase().includes(q))}
  const tools=`<div class="tools" style="margin-bottom:10px"><input id="q" placeholder="Søk kunde, prosjekt, adresse" value="${esc(S.q)}" autocomplete="off"></div><div class="chips filt">${[['','Aktive'],['oppf','Til oppfølging'],['Befaring','Befaring'],['Sendt tilbud','Tilbud ute'],['Skal utføres','Skal utføres'],['Ferdig utført','Ferdig utført'],['alle','Alle']].map(([k,l])=>`<button type="button" class="chip ${S.st===k?'on':''}" data-stf="${esc(k)}">${l}${k==='oppf'&&kpis().oppf.length?` · ${kpis().oppf.length}`:''}</button>`).join('')}</div>`;
  const cards=list.length?`<div class="list">${list.map(ordCard).join('')}</div>`:`<div class="empty">${all.length?'Ingen treff.':'Ingen ordre ennå.'}</div>`;
  const o=S.ord&&Store.get('ordre',S.ord);
  let h=(o&&!wide())?'':pageHead('Ordrebok','En jobb. Én mappe.','',`<button class="btn" data-new="1">${ICON.plus}Ny ordre</button>`);
  if(S.panel)return h+vPanel();
  h+=`<div class="split ${o?'has':''}"><div class="pane-list">${tools}${cards}</div><div class="pane-detail">${o?vMappe(o):`<div class="chooser"><div class="eyebrow">Ordrebok</div><h2>Velg en ordre, eller start med en ny.</h2><p>Alt om jobben samles her: kunde, befaring, tilbud, bilder og notater.</p></div>`}</div></div>`;
  return h}

function vMappe(o){const s=sumTilbud(o);const g=gaps(o);
  let h=`<div class="backrow"><button class="btn sec sm" data-back="1">${ICON.back}Alle ordre</button><span class="help">${esc(lbl(o))} · opprettet ${esc(dmy((o.opprettet||'').slice(0,10)))}</span></div>`;
  h+=`<div class="fold"><div class="eyebrow">${esc(o.type||'')}</div><h1>${esc(o.tittel||'(uten tittel)')}</h1><div class="s">${esc(o.kunde||'Ingen kunde')}${o.adresse?' · '+esc(o.adresse):''}</div><div class="money"><div><div class="l">Status</div><div class="v" style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${stv(o.status)}"></span>${esc(o.status)}</div></div><div><div class="l">Tilbud eks. mva</div><div class="v num">${s.eks?nok(s.eks):'–'}</div></div>${o.befaring?`<div><div class="l">Befaring</div><div class="v">${esc(dmy(o.befaring))}</div></div>`:''}</div>${g.length?`<p class="help" style="margin:12px 0 0">Mangler: ${esc(g.join(', '))}.</p>`:''}
  <div class="qa">${o.telefon?`<a class="btn sec sm" href="tel:${esc(o.telefon.replace(/\s/g,''))}">${ICON.phone}Ring</a><a class="btn sec sm" href="sms:${esc(o.telefon.replace(/\s/g,''))}">${ICON.msg}SMS</a>`:''}${o.adresse?`<a class="btn sec sm" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.adresse)}" target="_blank" rel="noopener">${ICON.pin}Veibeskrivelse</a>`:''}${nextStatus(o.status)?`<button class="btn sm" data-next="${esc(o._id)}">${ICON.arrow}${t('Neste')}: ${esc(t(nextStatus(o.status)))}</button>`:''}</div></div>`;
  h+=`<div class="tabs">${[['info','Jobben',''],['bef','Befaring','bef'],['tilbud','Tilbud',''],['ai','AI-tilbud','aitilbud'],['bilder','Bilder',''],['timer','Timer','timer'],['ks','KS/HMS','ks'],['soknad','Søknader','soknad'],['notat','Notater','']].map(([k,l,fe])=>`<button class="${S.ordTab===k?'on':''}" data-otab="${k}">${l}${fe&&!has(fe)?LOCK:''}</button>`).join('')}</div>`;
  if(S.ordTab==='info')h+=fInfo(o);
  else if(S.ordTab==='bef')h+=has('bef')?fBef(o):lockCard('bef','Befaringsskjema','Målepunkter tilpasset jobbtypen, autolagring mens du går rundt, og diktat. Alt havner i ordremappen og blir grunnlag for tilbudet.',['Mal per jobbtype – vindu, terrasse, kjøkken, mur …','Lagres mens du skriver, også uten dekning','Bilder og diktat samlet på ordren']);
  else if(S.ordTab==='tilbud')h+=fTilbud(o);
  else if(S.ordTab==='ai')h+=has('aitilbud')?fAiTilbud(o):lockCard('aitilbud','AI-skrevet tilbud','Beskriv jobben eller bruk befaringsskjemaet, så skriver AI et ferdig tilbud med linjer, mengder og dine priser. Du leser gjennom og sender.',['Tilbud klart på under ett minutt','Bruker din timepris, ditt påslag og dine vilkår','Ingenting sendes før du har sagt ja']);
  else if(S.ordTab==='bilder')h+=fBilder(o);
  else if(S.ordTab==='ks')h+=has('ks')?fKS(o):lockCard('ks','KS/HMS og egenkontroll','Sikker jobbanalyse før oppstart, egenkontroll når jobben er gjort, avvik med bilde og tiltak, og FDV-dokumentasjon til kunden – alt samlet i én KS-rapport.',['SJA og HMS-sjekk tilpasset jobbtypen','Avvik med alvorlighet og tiltak','KS-rapport og FDV som PDF til kunden']);
  else if(S.ordTab==='soknad')h+=has('soknad')?fSoknad(o):lockCard('soknad','Søknader til kommunen','Finn ut om tiltaket er søknadspliktig, lag nabovarsel og søknadsgrunnlag ferdig utfylt med kundens og eiendommens opplysninger, og få sjekkliste over vedlegg.',['Vurdering: unntatt / uten ansvarsrett / med ansvarsrett','Nabovarsel og søknadsgrunnlag som PDF','Sjekkliste over vedlegg og lenke til kommunens portal']);
  else if(S.ordTab==='timer')h+=has('timer')?fTimer(o):lockCard('timer','Timer på ordren','Stemple inn og ut på jobben, legg til timer manuelt, og få timene rett inn i tilbudet eller fakturagrunnlaget.',['Stemple inn/ut fra mobilen','Timer per ordre og per uke','Én knapp: timer → tilbud']);
  else h+=fNotat(o);
  return h}

function f(l,key,v,opt){opt=opt||{};const t=opt.type||'text';const full=opt.full?'full':'';const id=`id="f_${key}"`;
  if(t==='select')return `<label class="f ${full}">${l}<select ${id} data-f="${key}">${opt.opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
  if(t==='textarea')return `<label class="f ${full}">${l}<textarea ${id} data-f="${key}" placeholder="${esc(opt.ph||'')}">${esc(key==='vilkar'&&v===DEF.vilkar?window.t(v):v)}</textarea></label>`;
  return `<label class="f ${full}">${l}<input ${id} data-f="${key}" type="${t}" value="${esc(v==null?'':v)}" placeholder="${esc(opt.ph||'')}" autocomplete="off"></label>`}

function fTilbud(o){const i=inn();const linjer=(o.linjer&&o.linjer.length)?o.linjer:[{beskrivelse:'',antall:1,enhet:'stk',pris:''}];const s=sumTilbud(Object.assign({},o,{linjer}));

  let h=`<div class="box"><h2>Tilbud ${o.tilbudNr?'T-'+esc(o.tilbudNr):''}<span class="chip st" style="margin-left:auto;letter-spacing:0;text-transform:none"><span class="sdot" style="background:var(--accent)"></span>${esc(t(pt))}${privat?' · '+t('inkl. mva'):' · '+t('eks. mva')}</span></h2>
  <div class="tools" style="margin-bottom:8px"><button type="button" class="btn sec sm" data-addline="arbeid">+ Arbeid (${i.timepris} kr/t)</button><button type="button" class="btn sec sm" data-addline="mat">+ Materiell</button><button type="button" class="btn sec sm" data-addline="">+ Linje</button></div>
  <div style="overflow-x:auto"><table class="lines" id="lines"><thead><tr><th>Beskrivelse</th><th style="width:70px">Antall</th><th style="width:64px">Enhet</th><th style="width:96px">Pris</th><th></th></tr></thead><tbody>${linjer.map((l,n)=>`<tr><td><input data-l="beskrivelse" value="${esc(l.beskrivelse)}" placeholder="F.eks. Bytte vindu 120×140"></td><td class="n"><input data-l="antall" type="number" step="any" inputmode="decimal" value="${esc(l.antall)}"></td><td><input data-l="enhet" value="${esc(l.enhet||'stk')}"></td><td class="n"><input data-l="pris" type="number" step="any" inputmode="decimal" value="${esc(l.pris)}"></td><td class="x"><button type="button" data-rmline="${n}" aria-label="Fjern">×</button></td></tr>`).join('')}</tbody></table></div>
  <div class="sum" id="sumbox">${sumRows(s)}</div>
  ${privat&&hjemme?`<div class="note" style="margin-top:14px"><b>${t('Angrerett')}</b> · ${t('Avtalen inngås hos kunden, derfor legges angrerettinformasjon og angreskjema automatisk ved tilbudet. Kunden har 14 dagers angrerett fra avtaledagen.')}<label class="check" style="margin-top:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-f="oppstartFor" ${o.oppstartFor?'checked':''} style="width:20px;height:20px;margin-top:2px;flex:none"><span>${t('Kunden har uttrykkelig bedt om oppstart før angrefristen går ut, og er informert om at angreretten tapes når arbeidet er fullført.')}</span></label>${o.avtaledato?`<div class="help" style="margin-top:6px">${t('Avtaledato')} ${esc(dmy(o.avtaledato))} · ${t('angrefrist')} ${esc(dmy(addDays(o.avtaledato,14)))}</div>`:''}</div>`:''}

  <div class="actions"><button type="button" class="btn" data-savelines="1">Lagre tilbud</button><button type="button" class="btn acc" data-pdf="1">Lag PDF</button>${S.pdf===o._id&&S.pdfBlob?`<button type="button" class="btn" data-pdfdl="1">Last ned PDF</button>`:''}<button type="button" class="btn sec" data-copytext="1">Kopier som tekst</button></div>
  <div class="actions" style="margin-top:8px"><button type="button" class="btn sec sm" data-share="sms">Send som SMS</button><button type="button" class="btn sec sm" data-share="epost">Send som e-post</button><button type="button" class="btn sec sm" data-share="del">Del …</button></div>
  <p class="help" style="margin-top:10px">Lag PDF først, så følger den med når du deler.</p>`;
  if(['Skal utføres','Ferdig utført','Oppfølging','Avsluttet'].includes(o.status)){const tot=tEntries(o).reduce((s,x)=>s+hrs(x.inn,x.ut),0);h+=`</div><div class="box"><h2>Fakturagrunnlag</h2><p class="help">Når jobben er gjort: lag et fakturagrunnlag med tilbudslinjene${tot?` og ${dur(tot)} registrerte timer`:''}, klart til regnskapsføreren eller Fiken.</p><div class="actions"><button type="button" class="btn" data-faktura="1">Lag fakturagrunnlag (PDF)</button><button type="button" class="btn sec" data-fakturatxt="1">Kopier som tekst</button></div>`}
  h+=``;

function befPoints(o){if(o.bef&&o.bef.length)return o.bef;return (BEF_MAL[o.type]||BEF_MAL.Annet).map((l,i)=>({id:'p'+i,l:t(l),v:''}))}
function fBef(o){const pts=befPoints(o);const fylt=pts.filter(x=>x.v).length;
  return `<div class="box"><h2>Befaringsskjema <span class="pill">${fylt}/${pts.length}</span><span class="help" id="befSt" style="margin-left:auto;letter-spacing:0;text-transform:none;font-weight:400">${o.befOppdatert?'Lagret '+esc(o.befOppdatert.slice(11,16)):'Lagres automatisk'}</span></h2>
  <div class="grid">${f('Befaringsdato','befaring',o.befaring,{type:'date'})}${f('Møt','befKontakt',o.befKontakt,{ph:'Hvem møter du, telefon'})}</div>
  <div class="bef" id="bef" style="margin-top:14px">${pts.map(p=>`<div class="befrow" data-pid="${p.id}"><input class="befl" data-bef="l" value="${esc(p.l)}" placeholder="Hva skal måles / avklares" aria-label="Punkt"><input class="befv" data-bef="v" value="${esc(p.v||'')}" placeholder="–" aria-label="${esc(p.l)}"><button type="button" data-befdel="${p.id}" aria-label="Slett punktet">×</button></div>`).join('')}</div>

  <p class="help" style="margin-top:8px">Alt lagres mens du skriver. Bilder fra befaringen legger du under Bilder. I Pro skriver AI tilbudet fra skjemaet og diktatet.</p></div>`}
function befSave(){const o=Store.get('ordre',S.ord);if(!o)return;const rows=[...document.querySelectorAll('#bef .befrow')];o.bef=rows.map(r=>({id:r.dataset.pid,l:r.querySelector('[data-bef=l]').value,v:r.querySelector('[data-bef=v]').value}));const dk=document.querySelector('[data-dikt]');if(dk)o.diktat=dk.value;const bd=$('#f_befaring'),bk=$('#f_befKontakt');if(bd)o.befaring=bd.value;if(bk)o.befKontakt=bk.value;o.befOppdatert=nowIso();Store.put('ordre',o);const st=$('#befSt');if(st)st.textContent=t('Lagret')+' '+o.befOppdatert.slice(11,16);const pill=document.querySelector('.box .pill');if(pill)pill.textContent=o.bef.filter(x=>x.v).length+'/'+o.bef.length}

/* timer */
const tEntries=o=>Store.list('timer').filter(x=>x.ordre===o._id).sort((a,b)=>(b.inn||'').localeCompare(a.inn||''));
const activeStamp=()=>Store.list('timer').find(x=>!x.ut);
const hrs=(a,b)=>Math.max(0,(new Date(b||Date.now())-new Date(a))/3600000);
const dur=h=>{const m=Math.round(h*60);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
function stempelBox(){const a=activeStamp();if(!a)return '';const o=Store.get('ordre',a.ordre);return `<div class="box" style="border:1px solid var(--accent)"><h2>Stemplet inn</h2><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:0"><div class="num" style="font-size:32px;font-weight:400;line-height:1" data-stampclock="${esc(a.inn)}">${dur(hrs(a.inn))}</div><div class="help">${o?esc(lbl(o)+' '+(o.tittel||'')):''} · siden ${esc(a.inn.slice(11,16))}</div></div><button class="btn" data-tout="${esc(a._id)}">Stemple ut</button></div></div>`}
function fTimer(o){const list=tEntries(o);const a=activeStamp();const tot=list.reduce((s,x)=>s+hrs(x.inn,x.ut),0);const i=inn();

  else h+=`<div class="actions" style="margin:0 0 12px;align-items:center">${ansatte().length?`<select id="tperson" style="min-height:42px;border-radius:12px;border:1.5px solid var(--field-br);background:var(--field);color:var(--ink);padding:8px 12px">${ansatte().map(a=>`<option ${a===(S.tperson||inn().kontaktnavn)?'selected':''}>${esc(a)}</option>`).join('')}</select>`:''}<button class="btn" data-tin="${esc(o._id)}">Stemple inn</button></div>`;
  h+=`<form id="tManF" class="grid" style="margin-bottom:12px"><label class="f">Dato<input id="tm_d" type="date" value="${today()}"></label><label class="f">Timer<input id="tm_h" type="number" step="0.25" inputmode="decimal" placeholder="2.5"></label><label class="f full">Hva<input id="tm_n" placeholder="F.eks. riving og klargjøring"></label><div class="full actions" style="margin:0"><button class="btn sec sm">Legg til manuelt</button></div></form>`;
  h+=list.length?`<ul class="log">${list.map(x=>`<li><span class="num">${esc(dmy(x.inn.slice(0,10)))}</span><span style="flex:1">${x.ut?esc(x.inn.slice(11,16))+'–'+esc(x.ut.slice(11,16)):'pågår'}${x.notat?' · '+esc(x.notat):''}</span><span class="num">${x.ut?dur(hrs(x.inn,x.ut)):''}</span><button type="button" data-tdel="${esc(x._id)}" style="background:none;border:0;color:var(--muted);font-size:18px;line-height:1">×</button></li>`).join('')}</ul>`:'<div class="empty">Ingen timer ennå.</div>';
  if(tot>0)h+=`<div class="actions"><button class="btn sec sm" data-ttilbud="${esc(o._id)}">Legg ${dur(tot)} t inn i tilbudet (${i.timepris} kr/t)</button></div>`;
  h+=`</div>`;return h}

function kalItems(){const out=[];orders().filter(o=>AKTIVE(o.status)).forEach(o=>{if(o.befaring)out.push({d:o.befaring,t:'09:00',txt:'Befaring: '+(o.kunde||o.tittel||lbl(o)),sub:o.adresse||'',ord:o._id,kind:'bef'});if(o.oppf)out.push({d:o.oppf,t:'',txt:'Følg opp: '+(o.kunde||lbl(o)),sub:o.status,ord:o._id,kind:'oppf'})});Store.list('kal').forEach(k=>out.push({d:k.dato,t:k.fra||'',t2:k.til||'',txt:k.tittel,sub:k.sted||'',ord:k.ordre,kind:'kal',id:k._id}));return out.sort((a,b)=>(a.d+(a.t||'')).localeCompare(b.d+(b.t||'')))}
function weekStart(off){const d=new Date(today()+'T00:00:00');const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+7*(off||0));return d}
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* --- Vær fra met.no (ingen nøkkel). Posisjon: firmaadresse via Kartverket, ellers enhetens posisjon. --- */
const WX=(()=>{const K='ordra.wx';let c=null;try{c=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(c))}catch(e){}};
  const fresh=()=>c&&c.t&&(Date.now()-c.t)<2*3600e3&&c.days;
  async function geocode(adr){if(!adr)return null;const r=await fetch('https://ws.geonorge.no/adresser/v1/sok?treffPerSide=1&sok='+encodeURIComponent(adr));if(!r.ok)return null;const j=await r.json();const a=j.adresser&&j.adresser[0];return a&&a.representasjonspunkt?{lat:a.representasjonspunkt.lat,lon:a.representasjonspunkt.lon,navn:a.adressetekst+(a.poststed?', '+a.poststed:'')}:null}
  async function forecast(lat,lon){const r=await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat.toFixed(3)}&lon=${lon.toFixed(3)}`,{headers:{'Accept':'application/json'}});if(!r.ok)throw 0;const j=await r.json();const days={};
    (j.properties.timeseries||[]).forEach(ts=>{const dt=new Date(ts.time);const iso=isoD(dt);const h=dt.getHours();const inst=ts.data.instant.details;const n6=ts.data.next_6_hours,n1=ts.data.next_1_hours;const day=days[iso]||(days[iso]={min:99,max:-99,mm:0,sym:null,symH:99});day.min=Math.min(day.min,inst.air_temperature);day.max=Math.max(day.max,inst.air_temperature);if(n1)day.mm+=n1.details.precipitation_amount||0;else if(n6&&dt.getUTCHours()%6===0)day.mm+=n6.details.precipitation_amount||0;const sym=(n6&&n6.summary.symbol_code)||(n1&&n1.summary.symbol_code);if(sym&&Math.abs(h-12)<Math.abs(day.symH-12)){day.sym=sym;day.symH=h}});
    Object.values(days).forEach(x=>{x.mm=Math.round(x.mm*10)/10;x.min=Math.round(x.min);x.max=Math.round(x.max)});return days}
  return{
    get:()=>fresh()?c:null,sted:()=>c&&c.navn||'',
    async update(force){if(!force&&fresh())return c;const i=inn();let pos=null;if(i.lat&&i.lon)pos={lat:i.lat,lon:i.lon,navn:i.wxNavn||''};else if(i.adresse){try{pos=await geocode(i.adresse)}catch(e){}}if(!pos)return null;const days=await forecast(pos.lat,pos.lon);c={t:Date.now(),lat:pos.lat,lon:pos.lon,navn:pos.navn,days};save();return c},
    async useDevice(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(async p=>{try{const i=inn();i.lat=p.coords.latitude;i.lon=p.coords.longitude;i.wxNavn=t('Her du er');Store.setInnst(i);c=null;res(await WX.update(true))}catch(e){rej(e)}},rej,{timeout:8000,maximumAge:600e3}))},
    clear(){const i=inn();delete i.lat;delete i.lon;delete i.wxNavn;Store.setInnst(i);c=null;try{localStorage.removeItem(K)}catch(e){}}
  }})();
const WXI={clearsky:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',fair:'<circle cx="9" cy="9" r="3.5"/><path d="M9 2v1.5M2 9h1.5M4 4l1 1M14 4l-1 1M7 20h11a3.5 3.5 0 0 0 .5-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 7 20z"/>',cloud:'<path d="M7 19h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 19z"/>',rain:'<path d="M7 15h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',snow:'<path d="M7 15h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15z"/><path d="M8 19v2M12 19v2M16 19v2M7 20h2M11 20h2M15 20h2"/>',sleet:'<path d="M7 15h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15z"/><path d="M8 18l-1 3M12 19v2M16 18l-1 3"/>',fog:'<path d="M4 10h16M4 14h16M6 18h12"/>',thunder:'<path d="M7 14h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 14z"/><path d="M13 14l-2 4h3l-2 4"/>'};
const wxKind=sym=>{if(!sym)return null;const s=sym.replace(/_(day|night|polartwilight)$/,'');if(/thunder/.test(s))return 'thunder';if(/sleet/.test(s))return 'sleet';if(/snow/.test(s))return 'snow';if(/rain/.test(s))return 'rain';if(s==='fog')return 'fog';if(s==='clearsky')return 'clearsky';if(s==='fair')return 'fair';return 'cloud'};
const WXTXT={clearsky:'Klarvær',fair:'Lettskyet',cloud:'Overskyet',rain:'Regn',snow:'Snø',sleet:'Sludd',fog:'Tåke',thunder:'Torden'};
function wxIcon(day,small){if(!day||!day.sym)return '';const k=wxKind(day.sym);return `<span class="wx" title="${esc(t(WXTXT[k]||''))}${day.mm?' · '+day.mm+' mm':''}"><svg class="i" viewBox="0 0 24 24" style="width:${small?15:18}px;height:${small?15:18}px">${WXI[k]}</svg><span class="num">${day.max}°</span>${day.mm>=0.5?`<span class="num mm">${Math.round(day.mm)}mm</span>`:''}</span>`}
const wxDay=iso=>{const c=WX.get();return c&&c.days&&c.days[iso]||null};
const wxWarn=(iso,type)=>{const d=wxDay(iso);if(!d||!UTE.includes(type))return '';const k=wxKind(d.sym);if(d.mm>=3||k==='thunder')return `<span class="chip warn">${t(k==='snow'?'Snø ventet':k==='thunder'?'Torden ventet':'Regn ventet')} · ${d.mm} mm</span>`;if(d.min<=0&&(type==='Maling/mur'||type==='Grunnarbeid'))return `<span class="chip warn">${t('Frost ventet')} · ${d.min}°</span>`;return ''};

  if(c)return `<p class="help wxbar"><span>${t('Vær fra MET Norge (met.no)')}${c.navn?' · '+esc(c.navn):''}</span><button class="lnk" data-wxdev="1">${t('Bruk posisjonen min')}</button>${i.lat?`<button class="lnk" data-wxclear="1">${t('Bruk firmaadressen')}</button>`:''}</p>`;

/* ===== v0.14: Konto og synk (Supabase) – lokalt først, synk når innlogget ===== */
const SB_URL='https://felvyluwyagupazelqjt.supabase.co',SB_KEY='sb_publishable_oYBUjWWOvRZ0sPWB_juIZg_brRekQ2i';
const SYNC_COLLS=['ordre','kunder','kal','timer','tips','oppgaver','godkjenning','logg','agentlogg'];
const Sync=window.Sync=(()=>{
  const K='ordra.sb';let st={session:null,firma:null,queue:[],last:{},user:null};
  try{const s=localStorage.getItem(K);if(s)st=Object.assign(st,JSON.parse(s))}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
  let busy=false,timer=null,status='av';
  const hdr=(auth)=>{const h={'apikey':SB_KEY,'Content-Type':'application/json'};if(auth&&st.session)h['Authorization']='Bearer '+st.session.access_token;return h};
  async function api(path,opt={}){const r=await fetch(SB_URL+path,Object.assign({headers:hdr(true)},opt,{headers:Object.assign(hdr(true),opt.headers||{})}));if(r.status===401&&st.session){const ok=await refresh();if(ok)return api(path,opt)}return r}
  async function refresh(){if(!st.session||!st.session.refresh_token)return false;try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:hdr(false),body:JSON.stringify({refresh_token:st.session.refresh_token})});if(!r.ok){st.session=null;st.user=null;save();return false}const j=await r.json();st.session={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};st.user=j.user;save();return true}catch(e){return false}}
  function on(){return !!st.session}
  function redirectUrl(){return /github\.io/.test(location.host)?'https://asstrata-art.github.io/ordra/':(location.origin+location.pathname)}
  async function login(email){const r=await fetch(SB_URL+'/auth/v1/otp',{method:'POST',headers:hdr(false),body:JSON.stringify({email,create_user:true,data:{firma:(inn().firma||'')},options:{email_redirect_to:redirectUrl()}})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.error_description||j.message||'Kunne ikke sende lenke')}return true}
  async function verifyCode(email,token){const r=await fetch(SB_URL+'/auth/v1/verify',{method:'POST',headers:hdr(false),body:JSON.stringify({email,token,type:'email'})});const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||'Feil kode');setSession(j);await afterLogin();return true}
  function setSession(j){st.session={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};st.user=j.user||null;save()}
  async function logout(){try{await api('/auth/v1/logout',{method:'POST'})}catch(e){}st.session=null;st.user=null;st.firma=null;st.last={};save();status='av';render()}
  function parseHash(){const h=location.hash||'';if(!/access_token=/.test(h))return false;const q=new URLSearchParams(h.slice(1));if(q.get('access_token')){setSession({access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_in:Number(q.get('expires_in')||3600)});history.replaceState(null,'',location.pathname+location.search);return true}return false}
  async function loadFirma(){const r=await api('/rest/v1/medlem?select=firma_id,rolle,firma(id,navn,plan,innst,orgnr)&limit=1');if(!r.ok)return null;const rows=await r.json();if(!rows.length)return null;const m=rows[0];st.firma={id:m.firma_id,rolle:m.rolle,navn:m.firma&&m.firma.navn,plan:(m.firma&&m.firma.plan)||'gratis',innst:(m.firma&&m.firma.innst)||{}};save();return st.firma}
  async function afterLogin(){const f=await loadFirma();if(!f){toast('Fant ikke firma for kontoen');return}
    // firma-innstillinger inn i lokale innstillinger (uten å overskrive lokale verdier som finnes)
    const i=inn();const fi=f.innst||{};Object.keys(fi).forEach(k=>{if(i[k]==null||i[k]==='')i[k]=fi[k]});if(f.navn&&!i.firma)i.firma=f.navn;i.plan=f.plan;i.trialSource='konto';i.onbDone=true;Store.setInnst(i,true);
    // alt lokalt skal opp hvis databasen er tom for dette firmaet
    await pushAll();await pull();render()}
  function enqueue(op){st.queue.push(op);if(st.queue.length>5000)st.queue=st.queue.slice(-5000);save();kick()}
  function onPut(c,o){if(!on()||!SYNC_COLLS.includes(c))return;enqueue({t:'put',c,id:o._id,data:o})}
  function onDel(c,id){if(!on()||!SYNC_COLLS.includes(c))return;enqueue({t:'del',c,id})}
  function onInnst(i){if(!on()||!st.firma)return;enqueue({t:'innst',data:i})}
  function kick(){clearTimeout(timer);timer=setTimeout(flush,400)}
  async function flush(){if(busy||!on()||!st.firma||!navigator.onLine)return;busy=true;status='synker';setDot();
    try{while(st.queue.length){const op=st.queue[0];let r;
      if(op.t==='put')r=await api('/rest/v1/'+op.c+'?on_conflict=firma_id,id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:op.id,firma_id:st.firma.id,data:op.data,slettet:false})});
      else if(op.t==='del')r=await api('/rest/v1/'+op.c+'?firma_id=eq.'+st.firma.id+'&id=eq.'+encodeURIComponent(op.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({slettet:true})});
      else if(op.t==='innst'){const d=Object.assign({},op.data);delete d.logo;r=await api('/rest/v1/firma?id=eq.'+st.firma.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({innst:d,navn:d.firma||'',orgnr:d.orgnr||''})})}
      if(r&&(r.ok||r.status===404)){st.queue.shift();save()}else{status='feil';break}}
      if(!st.queue.length)status='ok'}
    catch(e){status='feil'}
    busy=false;setDot()}
  async function pull(){if(!on()||!st.firma||!navigator.onLine)return;let changed=false;
    for(const c of SYNC_COLLS){const since=st.last[c]||'1970-01-01T00:00:00Z';try{const r=await api('/rest/v1/'+c+'?select=id,data,slettet,updated_at&firma_id=eq.'+st.firma.id+'&updated_at=gt.'+encodeURIComponent(since)+'&order=updated_at.asc&limit=1000');if(!r.ok)continue;const rows=await r.json();if(!rows.length)continue;
      const n=Store.merge(c,rows.map(x=>({id:x.id,data:x.data,slettet:x.slettet,updated_at:x.updated_at})));if(n)changed=true;st.last[c]=rows[rows.length-1].updated_at}catch(e){}}
    try{const r=await api('/rest/v1/firma?select=plan,innst,navn&id=eq.'+st.firma.id);if(r.ok){const rows=await r.json();if(rows[0]){st.firma.plan=rows[0].plan||st.firma.plan;const i=inn();if(i.plan!==st.firma.plan){i.plan=st.firma.plan;Store.setInnst(i,true);changed=true}}}}catch(e){}
    save();if(changed)render();status=st.queue.length?'synker':'ok';setDot()}
  async function pushAll(){if(!on()||!st.firma)return;const all=Store.all();for(const c of SYNC_COLLS){Object.values(all[c]||{}).forEach(o=>st.queue.push({t:'put',c,id:o._id,data:o}))}if(all.innst)st.queue.push({t:'innst',data:all.innst});save();await flush()}
  function setDot(){const d=document.getElementById('syncdot');if(!d)return;d.className='syncdot '+status;d.title={ok:'Synket',synker:'Synker…',feil:'Synk feilet – prøver igjen',av:'Ikke innlogget'}[status]||''}
  async function init(){const fresh=parseHash();if(on()){if(fresh||!st.firma){await afterLogin()}else{await pull();flush()}}
    window.addEventListener('online',()=>{flush();pull()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();flush()}});setInterval(()=>{if(!document.hidden){pull();flush()}},90000)}
  return{init,login,verifyCode,logout,on,onPut,onDel,onInnst,pull,pushAll,flush,user:()=>st.user,firma:()=>st.firma,status:()=>status,queueLen:()=>st.queue.length}
})();
